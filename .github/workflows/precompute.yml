name: 종목 지표 미리 계산

on:
  schedule:
    # GitHub 예약 시각은 UTC 기준 (한국시간 = UTC + 9시간). 실제 실행은 몇 분~수십 분 늦을 수 있음
    - cron: "40 23 * * 0-4"   # 한국 08:40 (월~금) 국내 장 시작 전
    - cron: "10 3 * * 1-5"    # 한국 12:10 (월~금) 국내 장중
    - cron: "50 6 * * 1-5"    # 한국 15:50 (월~금) 국내 장 마감 후
    - cron: "20 21 * * 1-5"   # 한국 06:20 (화~토) 미국 장 마감 후
  workflow_dispatch: {}       # Actions 화면에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: precompute
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 이전 계산 파일 가져오기 (이번 계산이 실패하면 이전 파일 유지)
        run: |
          mkdir -p out
          if git fetch -q --depth 1 origin data; then
            git --work-tree=out checkout FETCH_HEAD -- . && git reset -q
          fi
          ls -la out

      # 한국투자증권 API는 쓰지 않는다 (자동 호출 0번, 키도 넘기지 않음)
      - name: 지표 계산 (야후 기준 공개)
        run: python precompute.py --out out

      - name: data 브랜치에 저장
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "지표 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
